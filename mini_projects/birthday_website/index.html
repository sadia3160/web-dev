<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="hero">
            <h1>Today is Mei's birthday!</h1>
            <img id="kusakabe" src="images/mei.jpg"> 
            <h2 id="b-age">10 years old</h2>
            <h4 id="b-date">02.10.2016</h4>
        </div>

        <div class="gift-section">
            <h2 id="gift-title">Here is how happy I am for you today</h2>
            <h3 id="gift-hint">(Hover over the gift)</h3>

            <div class="gift-cover" id="gift-cover-happy"></div>
        </div>

        <div class="gift-section">
            <h2 id="gift-title">How people react when you enter the room</h2>

            <div class="gift-cover" id="gift-cover-yay"></div>
        </div>

        <div class="gift-section">
            <h2 id="gift-title">If I had to describe you with one word</h2>

            <div class="gift-cover" id="gift-cover-cute"></div>
        </div>

        <p>♡ ♡ ♡</p>
        <div class="gift-section">
            <h2 id="gift-title">This one's for you, Dear!</h2>

            <div class="gift-cover" id="gift-cover-cheers"></div>
        </div>

    </body>
</html>
